# espec configuration. Read by the espec prompts before they write anything.

tickets:
  system: jira                  # jira | github
  jira:
    base_url: https://your-company.atlassian.net
    project_key: PROJ
    feature_issue_type: Story   # Issue type that carries feature definitions (Story, Epic, Feature)
  github:
    repo: your-org/your-repo
    label: feature-definition   # Label applied to issues that carry feature definitions

review:
  # Code review tool for implementation pull requests. diffcompass | none
  # DiffCompass (https://github.com/Mindera/diffcompass) gives the reviewer a guided, agent-led tour of
  # the diff in a local browser. Its espec-aware settings live in .diffcompass.json at the repo root.
  # /espec:review launches the tour. With none, /espec:implementation prints no review commands
  # and /espec:review points to the manual review instead.
  tool: diffcompass
  base: origin/main             # Branch the tour compares against before the pull request exists

security:
  # Security validation that /espec:implementation runs on a mobile app before it writes
  # pull-request.md. mobile-security-assessment | none
  # AI Mobile Security Assessment (https://github.com/Mindera/AI-Mobile-Security-Assessment) assesses
  # Android, iOS and Kotlin Multiplatform code against OWASP MASVS. The repository is private: the step
  # runs only when the signed-in GitHub user can read it and is skipped, with a note, otherwise.
  # Findings in files the change touches are fixed before the pull request. The rest go on the pull
  # request as an alert, with the report. With none, no security validation runs.
  tool: mobile-security-assessment
  repo: Mindera/AI-Mobile-Security-Assessment
  platforms: []                 # android | ios | kmp. Empty: detected from the repository

usage:
  # The usage line every espec command ends with (espec/AGENTS.md, "Usage report").
  # always | when-available | none
  # when-available prints it only when the tool shows the agent a figure. GitHub Copilot never does,
  # so there it prints nothing. none never prints it.
  report: always

# Spec hub (optional). Leave empty when the specs live next to the code, which is the recommended setup.
# In a spec hub this repository holds the specs only and the code lives in the repositories listed here.
# `espec/bin/espec repos` clones them side by side under repos/ (add /repos/ to .gitignore), and the
# commands read, change and review the code there. See "Spec hub" in espec/AGENTS.md.
repos: []
#  - name: web-app                # Folder under repos/, used in task group prefixes such as [web-app]
#    url: https://github.com/your-org/web-app.git
#    branch: main                 # Default branch: what repos checks out, and the review base

archive:
  clean:
    # Archived change folders older than this many days are listed for pruning by /espec:archive-clean.
    # 0 keeps every archived change forever.
    prune_archived_changes_older_than_days: 0

# Free-text context the AI applies when writing tech proposals, specs and tasks.
# Keep it short. Details that only matter to one phase go under rules.
context: |
  Describe the product in two sentences.
  Tech stack, main frameworks, how services talk to each other.
  Where tests live and how they run.
  Anything an engineer new to the repo must know before proposing a change.

# Rules appended to each phase. The AI applies them; it does not paste them into artifacts.
rules:
  feature-definition:
    - Acceptance criteria are written in GIVEN/WHEN/THEN.
  tech-proposal:
    - Every public API change is listed with its versioning strategy.
  specs:
    - Requirements describe observable behaviour, never internal mechanisms.
  tasks:
    - Every task group lands its own tests.
  implementation:
    - Run the full test suite before checking the last task of a group.
