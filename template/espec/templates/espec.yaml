ticket: <PROJ-123 or issue URL>
title: <title>
kind: feature                    # feature | bug
lane: standard                   # standard | small | urgent (see AGENTS.md, Lanes)
status: defined                  # defined | proposed | in-progress | implemented | archived | cancelled
created: <YYYY-MM-DD>
owners:
  product: <name>
  engineering: <name>
  qa: <name>
skip_specs: false                # true only when the main specs need no change (see AGENTS.md)
# declared_by: <name>                     # urgent lane: who declared the emergency
# catch_up_by: <YYYY-MM-DD>               # urgent lane: the date the paper is due
# archived: <YYYY-MM-DD>                  # set by /espec:archive
# archived_with_open_tasks: <reason>      # set by /espec:archive when archiving early
# archived_without_sync: <reason>         # set by /espec:archive when the deltas were not applied
# accepted_by: <name>                     # set by /espec:archive: who accepted the result
# accepted: <YYYY-MM-DD>                  # the date of the acceptance
# archived_without_acceptance: <reason>   # set by /espec:archive when nobody accepted
# metrics_review_due: <YYYY-MM-DD>        # set by /espec:archive: when the success metrics can be read
# metrics_reviewed: <YYYY-MM-DD>          # set by /espec:archive-clean when the outcome is recorded
# metrics_outcome: <outcome>              # met | partly met | not met | not measured, with the numbers
# cancelled: <YYYY-MM-DD>                 # set by /espec:archive when the change will not ship
# cancelled_reason: <reason>              # set together with cancelled
