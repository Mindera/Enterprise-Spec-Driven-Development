name: espec validate

# Checks every active change and every main spec under espec/ against the espec formats:
# feature definition sections and ids, four-hash scenarios, delta section names, task checkboxes,
# and that every delta still applies to the main spec as it is today.
# Then checks that the main specs change only through /espec:archive and /espec:archive-clean.
# The validator ships with the project in espec/bin, so this job needs no network access.
# It runs on every pull request, not only those that touch espec/, so it can be a required check.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate espec changes and specs
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: espec/config.yaml parses
        run: |
          if ! python3 -c 'import yaml' 2>/dev/null; then
            echo "PyYAML is not available on this runner; skipping the config.yaml syntax check."
          else
            python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' espec/config.yaml
            echo "espec/config.yaml parses"
          fi

      - name: Run espec validate
        run: bash espec/bin/espec validate

      # An archive moves a change folder under espec/changes/archive/, and archive-clean adds its
      # cleanup.md there, so a pull request that edits espec/specs/ without adding a file under
      # espec/changes/archive/ is a hand edit.
      - name: Main specs change only through archive or archive-clean
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -q '^espec/specs/' &&
             ! git diff --name-only --diff-filter=AR "$BASE_SHA"...HEAD | grep -q '^espec/changes/archive/'; then
            echo "::error::espec/specs/ changed, but no change was archived in this pull request."
            echo "Main specs change only through /espec:archive and /espec:archive-clean."
            echo "Put behaviour changes in the change's delta specs: espec/changes/<change-name>/specs/."
            exit 1
          fi
