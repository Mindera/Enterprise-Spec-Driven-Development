<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-label="espec, Enterprise Spec Driven Development">
  <rect width="720" height="160" rx="20" fill="#0b1220"/>
  <!-- icon: four functions, one spec -->
  <g transform="translate(40,32)">
    <rect x="0" y="0" width="42" height="42" rx="9" fill="#134e4a"/>
    <rect x="54" y="0" width="42" height="42" rx="9" fill="#134e4a"/>
    <rect x="0" y="54" width="42" height="42" rx="9" fill="#134e4a"/>
    <rect x="54" y="54" width="42" height="42" rx="9" fill="#2dd4bf"/>
    <!-- spec lines in the three soft blocks -->
    <rect x="10" y="14" width="22" height="4" rx="2" fill="#2dd4bf"/>
    <rect x="10" y="24" width="14" height="4" rx="2" fill="#2dd4bf"/>
    <rect x="64" y="14" width="22" height="4" rx="2" fill="#2dd4bf"/>
    <rect x="64" y="24" width="14" height="4" rx="2" fill="#2dd4bf"/>
    <rect x="10" y="68" width="22" height="4" rx="2" fill="#2dd4bf"/>
    <rect x="10" y="78" width="14" height="4" rx="2" fill="#2dd4bf"/>
    <!-- check in the solid block -->
    <path d="M65 76 l7 7 l15 -16" fill="none" stroke="#0b1220" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="168" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-3" fill="#f8fafc">e<tspan fill="#2dd4bf">spec</tspan></text>
  <text x="172" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2.5" fill="#94a3b8">ENTERPRISE SPEC DRIVEN DEVELOPMENT</text>
</svg>
