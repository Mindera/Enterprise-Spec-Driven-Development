name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Links, references, template workflow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Relative links resolve, no forbidden references, no em dashes
        run: python3 scripts/ci/check-docs.py
      - name: README shows VERSION, pull requests bump it
        run: python3 scripts/ci/check-version.py ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      - name: Template validate workflow parses
        run: python3 -c "import yaml, sys; d = yaml.safe_load(open('template/.github/workflows/espec-validate.yml')); print('jobs:', list(d['jobs']))"

  cli-bash:
    name: CLI and worked example (bash, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Smoke test
        run: bash scripts/ci/smoke-bash.sh

  cli-powershell:
    name: CLI and worked example (PowerShell, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Smoke test
        shell: pwsh
        run: ./scripts/ci/smoke-pwsh.ps1
