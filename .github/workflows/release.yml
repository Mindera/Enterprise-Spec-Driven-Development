name: release

# Tags and publishes every version merged to main. The tag is vX.Y.Z from VERSION and the release notes
# are that version's section of CHANGELOG.md, so projects can pin a version with git checkout vX.Y.Z.

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag and release VERSION
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the release when it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '\r\n' < VERSION)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          awk -v tag="$tag" '$1 == "##" { on = ($2 == tag); next } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no '## $tag' entry"; exit 1; }
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
